[project]
name = "copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "snowflake-connector-python>=3.12",
    "sqlglot>=25.0",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "mcp>=1.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    # Already present transitively via snowflake-connector-python, but the eval
    # runner's --publish path (copilot.eval.runner) now imports it directly to
    # call PutMetricData, so it needs to be a real, pinned direct dependency
    # rather than riding along on someone else's transitive closure.
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "dbt-snowflake>=1.8"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires .env credentials and network"]
addopts = "-m 'not live'"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]
