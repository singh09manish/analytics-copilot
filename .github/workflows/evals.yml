name: evals
on:
  schedule: [{cron: "17 6 * * 1"}]   # Mondays 06:17 UTC -- off the hour to avoid the
                                     # thundering herd every scheduler sees on :00
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  # Must track aws_secretsmanager_secret.app.name / local.name in infra/secrets.tf
  # and infra/main.tf -- Actions has no direct way to read a Terraform resource
  # attribute, so this is duplicated here deliberately and pinned by this comment
  # rather than silently drifting. Same pattern deploy.yml uses for ECS_CLUSTER etc.
  SECRET_NAME: analytics-copilot/runtime

jobs:
  evals:
    runs-on: ubuntu-latest
    # A live run (Anthropic + Snowflake, full golden + retrieval sets) normally
    # finishes in a couple of minutes; this is a ceiling against a hung step, not
    # an expected duration.
    timeout-minutes: 20
    # workflow_dispatch is selectable from any ref, but the OIDC trust policy
    # (infra/iam.tf) only allows the subject repo:<owner>/<repo>:ref:refs/heads/main
    # -- same reasoning, and same guard, as deploy.yml.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd backend && uv sync

      # This workflow has no pull_request trigger (see the removal note below),
      # so every run that reaches here is schedule or workflow_dispatch, and both
      # get a real key from repo secrets. This check remains only as a defensive
      # skip for the case where the secret is unset (a fresh repo bootstrap, a
      # revoked key) -- it must not turn a missing key into a hard failure here.
      # `present` is exposed as a step output, not inlined into a later step's
      # `if:`, because the `secrets` context cannot be referenced directly in a
      # step-level `if:` -- actionlint rejects it.
      - name: Check for ANTHROPIC_API_KEY
        id: anthropic_key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # --- schedule / workflow_dispatch: full golden set + retrieval set ---------
      #
      # Final review, Critical finding C3: this workflow used to also carry a
      # `pull_request:` trigger running `--subset 5` as a cheap per-PR smoke
      # check. It could not work and has been removed. A PR branch cannot assume
      # the deploy role below -- the OIDC trust condition in infra/iam.tf only
      # matches ref:refs/heads/main -- so that path had no Snowflake credentials
      # at all, while `retrieve()` (retrieval.py) unconditionally needs a live
      # Snowflake connection for schema-card lookup before a data_query case's
      # SQL is even generated, let alone validated. All five subset cases,
      # including the safety- cases the subset exists to protect, failed with
      # error_type="snowflake" without ever reaching the guard -- and only forks
      # are excluded from repo secrets, so a same-repo PR still received
      # ANTHROPIC_API_KEY: every ordinary PR spent real Anthropic API calls to
      # manufacture five guaranteed FAILs, which (until the `shell: bash` fix
      # just below, C1) still reported green. The guard already has real,
      # hermetic, zero-cost coverage on every PR: backend/tests/test_sql_guard.py,
      # run by ci.yml, needs no warehouse and no API key. This workflow now only
      # ever runs against a live, deployed stack (schedule, or workflow_dispatch
      # off main) where Snowflake is actually reachable. The runner's `--subset N`
      # flag (runner.py) is kept regardless -- still useful for a cheap manual
      # `workflow_dispatch` run against that live stack -- even though the
      # default dispatch here runs the full set via `--publish`.
      - name: Configure AWS credentials
        if: |
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          steps.anthropic_key.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Reads the same Secrets Manager secret the ECS task reads (infra/secrets.tf)
      # instead of duplicating Snowflake credentials as a second GitHub secret, so
      # there is one source of truth that a credential rotation only has to update
      # once. That is why infra/iam.tf grants this role
      # secretsmanager:GetSecretValue scoped to exactly this one secret ARN -- a
      # permission Phase 3A deliberately withheld from it.
      - name: Fetch Snowflake credentials
        if: |
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          steps.anthropic_key.outputs.present == 'true'
        run: |
          secret_json=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" --query SecretString --output text)
          account=$(echo "$secret_json" | jq -r '.SNOWFLAKE_ACCOUNT')
          key_pem=$(echo "$secret_json" | jq -r '.SNOWFLAKE_PRIVATE_KEY_PEM')
          echo "::add-mask::$account"
          echo "SNOWFLAKE_ACCOUNT=$account" >> "$GITHUB_ENV"
          # The PEM is multi-line, so it needs GITHUB_ENV's heredoc form -- a bare
          # KEY=VALUE line would silently truncate at the first newline.
          {
            echo "SNOWFLAKE_PRIVATE_KEY_PEM<<SNOWFLAKE_PEM_EOF"
            echo "$key_pem"
            echo "SNOWFLAKE_PEM_EOF"
          } >> "$GITHUB_ENV"

      # Final review, Critical finding C1: GitHub's default Linux shell is
      # `bash -e {0}` with NO pipefail, so `runner | tee scorecard.txt` discarded
      # the runner's own exit code -- a real SAFETY REGRESSION (runner.py's
      # sys.exit(1) when a safety- case fails) printed to the log while this step,
      # and the job, still reported success. `shell: bash` opts this step into
      # `bash -eo pipefail {0}` instead, so a non-zero runner exit now fails it.
      - name: Run full eval + retrieval sets and publish to CloudWatch
        if: |
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          steps.anthropic_key.outputs.present == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd backend && uv run python -m copilot.eval.runner --publish | tee ../scorecard.txt

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard
          path: scorecard.txt
          if-no-files-found: ignore
